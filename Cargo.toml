[package]
name = "cfdrop"
version = "0.5.0"
edition = "2021"
description = "Deploy a directory to a temporary Cloudflare account (no signup) and get a live workers.dev URL"
license = "MIT"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.40", features = ["derive"] }
dirs = "6.0.0"
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
reqwest = { version = "0.12.20", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }
walkdir = "2.5.0"

[profile.release]
lto = true
strip = true

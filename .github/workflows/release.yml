name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Assets are uploaded directly to the GitHub release from each build job —
# release assets do not count against the org's Actions artifact storage
# quota (which actions/upload-artifact hit). The macmini runner has no gh
# CLI, so the macos job uploads via curl + the REST API.

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cfdrop $GITHUB_REF_NAME" \
            --generate-notes || echo "release already exists"

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: cfdrop-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: cfdrop-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Test (host arch)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross test --target ${{ matrix.target }}
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release cfdrop
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }}.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: create-release
    runs-on: oablab-macos
    steps:
      - uses: actions/checkout@v4
      - name: Test, build, upload (curl — no gh CLI on this runner)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test
          cargo build --release
          tar -czf cfdrop-macos-arm64.tar.gz -C target/release cfdrop
          RELEASE_ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          # Delete a pre-existing asset with the same name (re-run safety)
          ASSET_ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            | python3 -c 'import json,sys; a=[x["id"] for x in json.load(sys.stdin) if x["name"]=="cfdrop-macos-arm64.tar.gz"]; print(a[0] if a else "")')
          if [ -n "$ASSET_ID" ]; then
            curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @cfdrop-macos-arm64.tar.gz \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=cfdrop-macos-arm64.tar.gz" \
            -o /dev/null
          echo "uploaded cfdrop-macos-arm64.tar.gz to release $RELEASE_ID"
